<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPlant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/cadastrarUsuarioo .css">
</head>
<body>
    <header class="main-header">
        <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant" class="logo-img" height="60" style="cursor: pointer;">
        <nav class="nav-auth"></nav>
    </header>

    <a href="../index.html" class="close-global-btn" title="Fechar">x</a>

    <main class="login-container">
        <section class="login-box">
            <!-- Formulário unificado -->
            <form id="formCadastro" class="login-form">
                <h2>Bem-vindo(a) ao SmartPlant</h2>
                <p>Crie sua conta!</p>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Email" id="email" required> 
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="password-input">
                        <input type="password" placeholder="Senha" id="senha" required>
                        <i class="fas fa-eye-slash" id="togglePassword" style="cursor: pointer;"></i>
                    </div>
                </div>
                
                <button type="submit" id="btnCadastrar" class="btn-submit">Criar Conta</button>
            </form>
        </section>
    </main>

    <script src="../js/cadastroUsuarioo.js"></script>
</body>
</html>
