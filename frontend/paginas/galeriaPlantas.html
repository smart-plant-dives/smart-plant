<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plant - Histórico de Plantas</title>
    <link rel="stylesheet" href="/css/galeriaPlantas.css">
</head>


<body>

     <!-- HEADER --> 

    <header class="header"> 

        <div class="logo"> 
             <a href="/index.html">
        <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant"></a>

        </div> 

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar plantas...">
            
        </div>

        <div class="buttons"> 

            <a href="addPlantas.html"> 

    <button class="btn conta"> 
Sua conta </button> 

</a>

        </div> 

    </header> 

    <main class="container">
        <div class="page-header">
            <h1>Histórico de <span>Plantas</span></h1>
            <div class="filter-section">
                <p>Veja e gerencie suas plantinhas</p>
                        <section class="content"> 

        <div class="top"> 
            <select id="opcoes"> 
                <option value="todas">Todas</option> 
                <option value="ornamental">Ornamental</option> 
                <option value="medicinais">Medicinais</option> 
                <option value="alimenticias">Alimentícias</option> 
                <option value="aromaticas">Aromáticas</option> 
                <option value="toxicas">Tóxicas</option> 
                <option value="frutifera">Frutífera</option>
            </select> 
                    </select>
                </div>
            </div>
        </div>

        <section class="plant-grid">
            <p id="mensagemVazia" style="display: none; text-align:center; margin-top:20px;">🌱 Nenhuma planta foi encontrada nessa categoria.</p>
            </section>
    </main>

     <!-- FOOTER --> 
    <footer class="footer"> 
        <div class="contact"> 
            <img src="https://thumbnail.imgbin.com/11/3/18/telephone-call-green-phone-icon-with-signal-waves-RrwNw8zN_t.jpg" alt="Telefone" height="20"> 
            <p>Contate-nos: (15) 92809-2649</p> 
        </div> 

        <div class="copyright"> 
            <img src="https://cdn-icons-png.flaticon.com/512/102/102649.png" alt="Segurança" height="20"> 
            <p>© Todos os Direitos Reservados</p> 
        </div> 

        <div class="social"> 
            <img src="https://cdn.imgbin.com/1/15/4/imgbin-logo-whatsapp-computer-icons-viber-call-icon-rUC3mkCwdZBU8fCG71krgSdfd.jpg" alt="WhatsApp" height="20" background-color: rgba(0, 0, 0, 0) > 
            <img src="https://image.similarpng.com/file/similarpng/very-thumbnail/2020/05/Icon-Instagram-PNG.png" alt="Instagram" height="20" background-color: rgba(0, 0, 0, 0)> 
            <img src="https://www.citypng.com/public/uploads/preview/outline-round-facebook-fb-icon-logo-701751695134773jn1popsjn6.png" alt="Facebook" height="20" background-color: rgba(0, 0, 0, 0) > 
        </div> 
    </footer> 


   <div id="modalDetalhes" class="modal hidden">
    <div class="modal-content">

        <!-- HEADER -->
        <div class="modal-header">
            <div class="user-info">
                <div class="avatar"></div>
                <span id="detalheUsuario">Usuario</span>
            </div>
            <button id="fechar">✕</button>
        </div>

        <!-- IMAGEM -->
        <img id="detalheImg" class="modal-img" src="" alt="Planta">

        <!-- FORM -->
        <div class="modal-body">
            <input id="detalheNome" class="input" readonly>
            <input id="detalheEspecie" class="input" readonly>
            <input id="detalheCategoria" class="input" readonly>
            <textarea id="detalheDescricao" class="textarea" readonly></textarea>
        </div>
    </div>
</div>

    <script src="/js/galeriaPlantas.js"></script>
</body>
</html>
