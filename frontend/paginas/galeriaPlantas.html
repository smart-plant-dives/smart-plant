<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plant - Histórico de Plantas</title>
  <link rel="stylesheet" href="../css/galeriaPlantas.css">
</head>

<body>

    <header class="header"> 
        <div class="logo"> 
             <a href="../index.html">
        <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant"></a>
        </div> 

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar plantas...">
        </div>

        <div class="buttons">
            <a href="addPlantas.html"> 
    <button class="btn conta"> Sua conta </button> 
</a>
        </div> 
    </header> 

    <main class="container">
        <div class="page-header">
            <h1>Histórico de <span>Plantas</span></h1>
            <div class="filter-section">
                <p>Veja e gerencie suas plantinhas</p>
                <select id="opcoes">
                    <option value="todas">Todas</option>
                </select>
            </div>
        </div>

        <section class="plant-grid">
            <p id="mensagemVazia" style="display: none; text-align:center; margin-top:20px;">🌱 Nenhuma planta foi encontrada nessa categoria.</p>
            </section>
    </main>

   <div id="modalDetalhes" class="modal hidden">
    <div class="modal-content">

        <div class="modal-header">
            <div class="user-info">
                <div class="avatar"></div>
                <span id="detalheUsuario">Usuario</span>
            </div>
            <button id="fechar">✕</button>
        </div>

        <img id="detalheImg" class="modal-img" src="" alt="Planta">

        <div class="modal-body">
            <input id="detalheNome" class="input" readonly>
            <input id="detalheEspecie" class="input" readonly>
            <input id="detalheCategoria" class="input" readonly>
            <textarea id="detalheDescricao" class="textarea" readonly></textarea>
        </div>
    </div>
</div>

   <script src="../js/galeriaPlantas.js"></script>
</body>
</html>
