  <section class="login-box">

    <!-- LOGIN -->
    <form id="form-login" class="login-form">
      <h2>Bem-vindo(a) ao SmartPlant</h2>
      <p>Acesse sua conta e continue cuidando das suas plantas.</p>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Email" required>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <div class="password-input">
          <input type="password" placeholder="Senha" required>
          <i class="fas fa-eye-slash"></i>
        </div>
      </div>

      <a href="#" class="forgot-password">Esqueceu a senha?</a>

      <button class="btn-submit">Entrar</button>
    </form>

    <!-- CADASTRO -->
    <div class="register-promo">
      <h3>Ainda não possui conta?</h3>
      <p>Crie sua conta e comece a cuidar ainda melhor das suas plantas.</p>
      <a href="cadastroEntrar.html" class="btn-outline">Criar conta</a>
    </div>

  </section>
</main>
