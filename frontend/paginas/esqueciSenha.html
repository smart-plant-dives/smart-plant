<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPlant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/esqueciSenha.css">
</head>
<body>

<header class="main-header">
    <a href="../index.html">
        <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant" class="logo-img">
    </a>
</header>


<main class="reset-container">

    <div class="reset-card">
        
        <form id="form-reset" class="login-form">
            <a href="cadastroUsuario.html" class="close-global-btn" title="Fechar">X</a>
            <h2>Bem-vindo(a) ao SmartPlant</h2>
            <p class="subtitle">Crie uma nova senha</p>

            <div class="input-group">
                <label>Nova Senha</label>
                <div class="password-inputs">
                    <input id="password" type="password" placeholder="Senha" required>
                    <i class="fas fa-eye-slash toggle-password" style="cursor: pointer;"></i>

                    <ul class="password-rules">
                        <li class="regra-item">A senha não pode ser igual à antiga</li>
                        <li class="regra-item">Use 8 ou mais caracteres, incluindo números ou símbolos</li>
                    </ul>
                </div>
            </div>

            <div class="input-group">
                <label>Confirme a senha</label>
                <div class="password-input">
                    <input type="password" placeholder="Confirme a senha" id="confirmarSenha" required>
                    <i class="fas fa-eye-slash toggle-password" style="cursor: pointer;"></i>
                </div>
            </div>

            <p id="mensagem-erro" style="color:red;"></p>

            <button type="submit" class="btn-submit">Salvar</button>
        </form>
    </div>

</main>



<script src="../js/esqueciSenha.js"></script>
</body>
</html>
