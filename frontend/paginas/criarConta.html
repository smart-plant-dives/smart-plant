<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plant - Cadastro</title>
    <link rel="stylesheet" href="../css/criarConta.css">
</head>

<body>

<header>
    <div class="logo">
        <a href="/index.html">
        <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant"></a>
        <button class="btn homepage" > </button>
    </div>

   <div class="buttons">
        <a href="/paginas/galeriaPlantas.html">
            <button class="btn addPlantas">Galeria</button>
        </a>
    </div>
</header>


<main>

<section class="card">

    <h1>Faça sua conta!</h1>

    <div class="form-area">

        <div class="foto-area">

            <div class="foto-container">
                <img id="preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            </div>

            <p>
                JPG, PNG ou WEBP<br>
                Máx. 2MB.
            </p>

            <label class="upload">
                Colocar Foto
                <input type="file" id="foto" accept="image/*">
            </label>

        </div>



        <form id="form">

            <label>Nome</label>
            <input 
            type="text" 
            id="nome"
            placeholder="Username">

            <label>Username</label>
            <input 
            type="text" 
            id="username"
            placeholder="@seuusuario">

            <label>Instagram</label>
            <input 
            type="text"
            id="instagram"
            placeholder="Url da sua conta do instagram">


            <label>Facebook</label>
            <input 
            type="text"
            id="facebook"
            placeholder="Url da sua conta do facebook">

            
                <div class="input-group">
          <label for="username">Usuário</label>
           <input type="text" id="username" placeholder="@usuario" readonly>
            </div>


            <label>Sobre você:</label>

            <textarea 
            id="sobre"
            placeholder="Fale um pouco sobre você..."></textarea>


            <div class="buttons">

                <button 
                type="button" 
                class="cancelar">
                    Cancelar
                </button>


                <button 
                type="submit" 
                class="salvar">
                    Salvar Conta
                </button>

            </div>


        </form>

    </div>

</section>


</main>


<script src="/js/criarConta.js"></script>

</body>
</html>
