<!DOCTYPE html>

<html lang="pt-br">



<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>SmartPlant - Suas Plantas</title>



<link rel="stylesheet" href="../css/addPlantas.css">

</head>



<body>



<!-- HEADER -->

<header class="header">



    <div class="logo">

        <a href="../index.html">

        <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant"></a>

        <button class="btn homepage" > </button>

    </div>



    <div class="buttons">

        <a href="galeriaPlantas.html">

            <button class="btn addPlantas">Galeria</button>

        </a>

    </div>



</header>



<div class="line"></div>



<!-- MAIN -->

<main class="container">



    <!-- PERFIL -->

    <aside class="sidebar">



        <div class="profile">



            <div class="avatar big">

                <button class="edit-profile">✏</button>

            </div>



            <img id="fotoPerfil" class="foto-perfil">

            <span id="nomeUsuario"></span>



            <h2 id="username"></h2>



            <p id="bioUsuario"></p>



            <div class="social2">

                <br>

                <img src="https://image.similarpng.com/file/similarpng/very-thumbnail/2020/05/Icon-Instagram-PNG.png" height="20">

                <img src="https://www.citypng.com/public/uploads/preview/outline-round-facebook-fb-icon-logo-701751695134773jn1popsjn6.png" height="20">

            </div>



        </div>



    </aside>



    <!-- CONTEÚDO -->

    <section class="content">



        <div class="top">

            <h1>Suas Plantas</h1>



            <select id="opcoes">
                <option value="todas">Todas</option>
            </select>

        </div>

<!-- CARDS -->
 <div class="cards" id="cards">
    <p id="mensagemVazia" style="display:none; text-align:center; margin-top:20px;">🌱 Nenhuma planta foi encontrada nessa categoria.</p>

        <!-- BOTÃO ADD -->
          <div class="card add" id="abrirModal">
            <span>+</span>
            <p>Adicionar nova planta</p>
        </div> </div>



    </section>



</main>



<!-- FOOTER -->

<footer class="footer">



    <div class="contact">

        <img src="https://thumbnail.imgbin.com/11/3/18/telephone-call-green-phone-icon-with-signal-waves-RrwNw8zN_t.jpg" height="20">

        <p>Contate-nos: (15) 92809-2649</p>

    </div>



    <div class="copyright">

        <img src="https://cdn-icons-png.flaticon.com/512/102/102649.png" height="20">

        <p>© Todos os Direitos Reservados</p>

    </div>



    <div class="social">

        <img src="https://cdn.imgbin.com/1/15/4/imgbin-logo-whatsapp-computer-icons-viber-call-icon-rUC3mkCwdZBU8fCG71krgSdfd.jpg" height="20">

        <img src="https://image.similarpng.com/file/similarpng/very-thumbnail/2020/05/Icon-Instagram-PNG.png" height="20">

        <img src="https://www.citypng.com/public/uploads/preview/outline-round-facebook-fb-icon-logo-701751695134773jn1popsjn6.png" height="20">

    </div>



</footer>




<!-- MODAL -->

<div id="modalPostagem" class="modal-overlay hidden">

    <div class="modal-container-post">

        <h2 class="titulo-modal">Adicionar Planta</h2>

        <!-- FORM -->
        <div class="post-form">

            <input type="text" id="nomePlanta" placeholder="Nome da planta">

            <input type="text" id="especie" placeholder="Espécie">

            <select id="categoria">
                <option value="">Selecionar categoria</option>
            </select>

            <input type="text" id="urlImagem" placeholder="Link da imagem (URL)">

        </div>

        <!-- BOTÕES -->
        <div class="modal-footer">
            <button id="fecharModal">Cancelar</button>
            <button id="btnSalvarPlanta" class="btn-save">Salvar</button>
        </div>

    </div>

</div>

<!-- MODAL EDITAR -->

<div id="modalEditar" class="modal-overlay hidden">

    <div class="modal-container-post">

        <div class="post-form">

            <input type="text" id="editNome" placeholder="Nome da planta">

            <input type="text" id="editEspecie" placeholder="Espécie">

            <select id="editCategoria">
                <option value="">Selecione a categoria</option>
            </select>

            <input type="text" id="editUrlImagem" placeholder="Link da imagem (URL)">

        </div>

        <div class="modal-footer">
            <button id="cancelarEdicao">Cancelar</button>
            <button id="salvarEdicao" class="btn-save">Salvar alterações ✔</button>
        </div>

    </div>

</div>

<!-- MODAL EDITAR PERFIL -->

<div id="modalPerfil" class="modal-overlay hidden">

        

    <div class="modal-container">

        <h2 class="modal-title">Editar Perfil</h2>

        

        <div class="modal-body">

            

            

            <div class="coluna-perfil-foto">

                

                <div class="moldura-foto-circular" id="molduraFoto">

                    <p class="texto-placeholder-foto" id="textoPlaceholder">Sua foto de perfil</p>

                    

                    <img src="" class="foto-perfil-imagem hidden" id="fotoPreview">

                </div>



                <p class="regras-foto">JPG, PNG ou WEBP<br>Máx. 2MB</p>

                

                <input type="file" id="inputFotoPerfil" accept="image/*" hidden>

                

                <button id="btnTrocarFoto" type="button" class="btn-trocar-foto">

                    Trocar foto

                </button>

            </div>



            <div class="perfil-form-section">

                <div class="form-group">

                    <label>Nome</label>

                    <input type="text" id="inputNome" value="">

                </div>

                

                <div class="form-group">

                    <label>Instagram</label>

                    <input type="url" id="inputInsta">

                </div>

                

                <div class="form-group">

                    <label>Facebook</label>

                    <input type="url" id="inputFace">

                </div>

                

                <div class="form-group">

                    <label>Sobre você</label>

                    <textarea id="inputSobre"></textarea>

                </div>

            </div>

        </div>



        <div class="modal-footer">

            <button id="cancelarPerfil">Cancelar</button>

            <button id="salvarPerfil" class="btn-save">Salvar alterações</button>

        </div>

        

    </div>

</div>



<script src="../js/addPlantas.js"></script>



</body>

</html>
