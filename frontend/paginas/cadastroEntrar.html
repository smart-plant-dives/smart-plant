<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPlant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/cadastrarEntrar .css">
</head>
<body> <header class="main-header">
    <img src="https://i.pinimg.com/736x/e7/35/8e/e7358e48ca6e2583c249b9c254bd88f1.jpg" alt="Smart Plant" class="logo-img" height="60" style="cursor: pointer;">
    <nav class="nav-auth"></nav>
</header>

<a href="/index.html" class="close-global-btn" title="Fechar">x</a>

<main class="login-container">
    <section class="login-box">
        <div class="login-form">
            <h2>Bem-vindo(a) ao SmartPlant</h2>
            <p>Crie sua conta!</p>
            
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" placeholder="Email" id="email"> 
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="password-input">
                    <input type="password" placeholder="Senha" id="senha">
                    <i class="fas fa-eye-slash" id="togglePassword" style="cursor: pointer;"></i>
                </div>
            </div>
            
            <button class="btn-submit">Entrar</button>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="contact">
        <img src="https://thumbnail.imgbin.com/11/3/18/telephone-call-green-phone-icon-with-signal-waves-RrwNw8zN_t.jpg" height="20">
        <p>Contate-nos: (15) 92809-2649</p>
    </div>

    <div class="copyright">
        <img src="https://cdn-icons-png.flaticon.com/512/102/102649.png" height="20">
        <p>© Todos os Direitos Reservados</p>
    </div>

    <div class="social">
        <img src="https://cdn.imgbin.com/1/15/4/imgbin-logo-whatsapp-computer-icons-viber-call-icon-rUC3mkCwdZBU8fCG71krgSdfd.jpg" height="20">
        <img src="https://image.similarpng.com/file/similarpng/very-thumbnail/2020/05/Icon-Instagram-PNG.png" height="20">
        <img src="https://www.citypng.com/public/uploads/preview/outline-round-facebook-fb-icon-logo-701751695134773jn1popsjn6.png" height="20">
    </div>
</footer>

<script src="/js/cadastroEntrar.js"></script>
</body>
</html>
